<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSU Padova Offline</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <style>
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: radial-gradient(circle at 20% 20%, #0ea5e9, #020617);
        color: #f8fafc;
        text-align: center;
        padding: 2rem;
      }
      main {
        max-width: 480px;
        background: rgba(2, 6, 23, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 25px 45px rgba(15, 23, 42, 0.4);
      }
      h1 {
        margin-bottom: 1rem;
        font-size: 2rem;
      }
      p {
        margin-bottom: 0.5rem;
        color: #cbd5f5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p>La dashboard RSU richiede una connessione attiva per sincronizzare le ultime richieste.</p>
      <p>Puoi comunque consultare gli ultimi dati salvati quando tornerai online.</p>
    </main>
  </body>
</html>
